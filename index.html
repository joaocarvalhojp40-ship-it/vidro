<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Vidro Sem Fundo (Fade)</title>
    <style>
        /* Configuração do fundo para destacar o efeito de vidro */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Elementos coloridos flutuando atrás para testar o desfoque */
        .circulo {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
        }
        .circulo-1 {
            width: 300px;
            height: 300px;
            background: rgba(236, 72, 153, 0.4);
            top: 20%;
            left: 30%;
        }
        .circulo-2 {
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.4);
            bottom: 15%;
            right: 25%;
        }

        /* O CONTAINER DO EFEITO DE VIDRO */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 450px;
            height: 500px;
            padding: 40px;
            color: white;
            box-sizing: border-box;
            border-radius: 24px;
            
            /* Efeito de Vidro (Morfismo) */
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.001));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            /* Borda fina apenas no topo e laterais (desaparece embaixo) */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: none;

            /* Máscara que faz o desfoque e o fundo sumirem na metade de baixo */
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }

        /* Textos decorativos internos */
        h1 {
            margin-top: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Elementos de fundo para gerar contraste sob o vidro -->
    <div class="circulo circulo-1"></div>
    <div class="circulo circulo-2"></div>

    <!-- Caixa de Vidro -->
    <div class="glass-card">
        <h1>Glass Effect</h1>
        <p>Este cartão possui o efeito de vidro fosco (glassmorphism) que desaparece gradualmente na parte inferior. O desfoque e as bordas somem de forma suave usando uma máscara de gradiente no CSS.</p>
    </div>

</body>
</html>
